<!DOCTYPE html>
<html lang="en">
<head>
<link rel="manifest" href="./manifest.webmanifest">
<meta name="theme-color" content="#2457d6">
<link rel="apple-touch-icon" href="./icon.svg">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Credit Card Tracker</title>
<style>
:root{--bg:#f5f7fb;--card:#fff;--text:#172033;--muted:#667085;--line:#e6e9ef;--accent:#2457d6;--good:#18864b;--warn:#b77900;--bad:#c62828}
*{box-sizing:border-box} body{margin:0;background:linear-gradient(180deg,#eef3ff 0,#f7f8fc 260px,var(--bg) 260px);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--text)}
header{background:transparent;padding:24px 18px 16px;position:sticky;top:0;z-index:5}
h1{font-size:24px;margin:0 0 5px}.sub{color:var(--muted);font-size:14px}
main{max-width:900px;margin:auto;padding:16px}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.stat,.card{background:rgba(255,255,255,.94);border:1px solid var(--line);border-radius:18px;padding:15px;box-shadow:0 5px 18px #14213d0d}.hero{background:linear-gradient(135deg,#173b9c,#3e68db);color:white;border:0}.hero .label{color:#dbe5ff}.hero b{font-size:31px}.hero .row{color:#e7edff}.hero .muted{color:#dbe5ff}
.stat b{display:block;font-size:21px;margin-top:5px}.label{font-size:12px;color:var(--muted)}
.section{display:flex;justify-content:space-between;align-items:center;margin:22px 2px 10px}.section h2{font-size:18px;margin:0}.top-actions{display:flex;gap:8px}
button{border:0;border-radius:10px;padding:10px 14px;font-weight:600;cursor:pointer}.primary{background:var(--accent);color:#fff}.secondary{background:#eef2ff;color:var(--accent)}.danger{background:#fff0f0;color:var(--bad)}
.cards{display:grid;gap:12px}.cardtop{display:flex;justify-content:space-between;gap:12px}.card h3{margin:0 0 4px;font-size:17px}.balance{font-size:25px;font-weight:700;margin:12px 0}.row{display:flex;justify-content:space-between;gap:10px;margin:7px 0;font-size:14px}.muted{color:var(--muted)}
.progress{height:8px;background:#edf0f5;border-radius:20px;overflow:hidden;margin:10px 0}.progress span{display:block;height:100%;background:var(--accent)}
.badge{font-size:12px;padding:5px 8px;border-radius:20px;background:#edf7f0;color:var(--good);white-space:nowrap}.badge.warn{background:#fff7e5;color:var(--warn)}.badge.bad{background:#fff0f0;color:var(--bad)}
.empty{text-align:center;color:var(--muted);padding:35px 10px}
dialog{border:0;border-radius:18px;width:min(92%,460px);padding:0;box-shadow:0 20px 70px #0004}dialog::backdrop{background:#0007}.modal{padding:20px}.modal h2{margin-top:0}label{display:block;font-size:13px;font-weight:600;margin:12px 0 5px}input{width:100%;padding:12px;border:1px solid #d7dce5;border-radius:10px;font-size:16px} .actions{display:flex;gap:8px;justify-content:flex-end;margin-top:18px}
.pay{border-top:1px solid var(--line);margin-top:12px;padding-top:12px}.paid{color:var(--good);font-weight:700}
@media(max-width:650px){.grid{grid-template-columns:repeat(2,1fr)}main{padding:12px}.stat{padding:12px}.stat b{font-size:18px}}
</style>
</head>
<body>
<header><h1>💳 Credit Card Tracker</h1><div class="sub">Track balances, due dates, payments and payoff progress.</div></header>
<main>
<section class="grid">
<div class="stat"><span class="label">Total Balance</span><b id="total">$0</b></div>
<div class="stat"><span class="label">Minimum Payments</span><b id="mins">$0</b></div>
<div class="stat"><span class="label">Planned Payments</span><b id="planned">$0</b></div>
<div class="stat"><span class="label">Cards</span><b id="count">0</b></div>
</section>

<section class="card hero" style="margin-bottom:12px">
<div class="label">TOTAL CREDIT CARD DEBT</div>
<b id="heroTotal">$0</b>
<div class="row" style="margin-top:15px"><span>Planned this cycle</span><strong id="heroPlanned">$0</strong></div>
<div class="row"><span>Next due</span><strong id="heroNext">—</strong></div>
</section>
<div class="section"><h2>My Cards</h2><div style="display:flex;gap:8px">
<button class="secondary" onclick="addSample()">Demo Data</button>
<button class="primary" onclick="openAdd()">+ Add Card</button>
</div></div>
<div id="cards" class="cards"></div>
<div class="section"><h2>Quick Summary</h2></div>
<div class="card" id="summary"></div>

<div class="section"><h2>Payment History</h2><button class="secondary" onclick="clearHistory()">Clear History</button></div>
<div id="history" class="cards"></div>
</main>

<dialog id="dlg"><div class="modal">
<h2 id="modalTitle">Add Credit Card</h2>
<form id="form">
<label>Card name<input id="name" required placeholder="e.g. Chase Sapphire"></label>
<label>Current balance<input id="balance" type="number" min="0" step="0.01" required placeholder="0"></label>
<label>Credit limit<input id="limit" type="number" min="0" step="0.01" placeholder="Optional"></label>
<label>Minimum payment<input id="minimum" type="number" min="0" step="0.01" required placeholder="0"></label>
<label>Due date<input id="due" type="date" required></label>
<label>Planned payment<input id="plannedInput" type="number" min="0" step="0.01" required placeholder="0"></label>
<div class="actions"><button type="button" class="secondary" onclick="dlg.close()">Cancel</button><button class="primary">Save</button></div>
</form></div></dialog>

<dialog id="payDlg"><div class="modal">
<h2>Record Payment</h2>
<p id="payCard" class="muted"></p>
<form id="payForm">
<label>Payment amount<input id="payAmount" type="number" min="0" step="0.01" required></label>
<label>Payment date<input id="payDate" type="date" required></label>
<div class="actions"><button type="button" class="secondary" onclick="payDlg.close()">Cancel</button><button class="primary">Mark Paid</button></div>
</form></div></dialog>

<script>
const KEY="cc_tracker_v1", HIST="cc_tracker_history_v1";
let cards=JSON.parse(localStorage.getItem(KEY)||"[]"), history=JSON.parse(localStorage.getItem(HIST)||"[]"), editing=null, paying=null;
const $=id=>document.getElementById(id), money=n=>new Intl.NumberFormat("en-US",{style:"currency",currency:"USD"}).format(n||0);
const today=()=>new Date().toISOString().slice(0,10);
function save(){localStorage.setItem(KEY,JSON.stringify(cards));localStorage.setItem(HIST,JSON.stringify(history));render()}
function addSample(){
 if(cards.length && !confirm("Add demo cards to your existing list?")) return;
 const d=new Date(); const y=d.getFullYear(),m=String(d.getMonth()+1).padStart(2,"0");
 cards.push(
 {id:crypto.randomUUID(),name:"Chase Sapphire",balance:3250,limit:10000,minimum:85,due:`${y}-${m}-25`,planned:500},
 {id:crypto.randomUUID(),name:"American Express",balance:1840,limit:8000,minimum:65,due:`${y}-${m}-28`,planned:300},
 {id:crypto.randomUUID(),name:"Capital One",balance:920,limit:5000,minimum:35,due:`${y}-${m}-03`,planned:100}
 ); save()
}
function openAdd(c=null){editing=c?.id||null;$("modalTitle").textContent=c?"Edit Credit Card":"Add Credit Card";$("name").value=c?.name||"";$("balance").value=c?.balance??"";$("limit").value=c?.limit??"";$("minimum").value=c?.minimum??"";$("due").value=c?.due||"";$("plannedInput").value=c?.planned??"";dlg.showModal()}
$("form").onsubmit=e=>{e.preventDefault();let obj={id:editing||crypto.randomUUID(),name:$("name").value,balance:+$("balance").value,limit:+$("limit").value||0,minimum:+$("minimum").value,due:$("due").value,planned:+$("plannedInput").value};let i=cards.findIndex(x=>x.id===obj.id);i>=0?cards[i]=obj:cards.push(obj);dlg.close();save()};
function status(c){let d=Math.ceil((new Date(c.due+"T23:59:59")-new Date())/86400000);return d<0?["Overdue","bad"]:d<=5?["Due soon","warn"]:["Upcoming",""];}
function render(){let total=cards.reduce((s,c)=>s+c.balance,0), mins=cards.reduce((s,c)=>s+c.minimum,0), plan=cards.reduce((s,c)=>s+c.planned,0);$("total").textContent=money(total);$("mins").textContent=money(mins);$("planned").textContent=money(plan);$("count").textContent=cards.length;
$("heroTotal").textContent=money(total);$("heroPlanned").textContent=money(plan);
let next=cards.slice().sort((a,b)=>a.due.localeCompare(b.due))[0];$("heroNext").textContent=next?`${next.name} • ${new Date(next.due+"T12:00:00").toLocaleDateString(undefined,{month:"short",day:"numeric"})}`:"—";
$("cards").innerHTML=cards.length?cards.map(c=>{let [st,cl]=status(c),util=c.limit?Math.min(100,c.balance/c.limit*100):0;return `<article class="card"><div class="cardtop"><div><h3>${esc(c.name)}</h3><div class="muted">Due ${new Date(c.due+"T12:00:00").toLocaleDateString()}</div></div><span class="badge ${cl}">${st}</span></div><div class="balance">${money(c.balance)}</div>${c.limit?`<div class="row"><span class="muted">Utilization</span><b>${util.toFixed(0)}%</b></div><div class="progress"><span style="width:${util}%"></span></div>`:""}<div class="row"><span class="muted">Minimum</span><b>${money(c.minimum)}</b></div><div class="row"><span class="muted">Planned payment</span><b>${money(c.planned)}</b></div><div class="actions"><button class="secondary" onclick='openAdd(${JSON.stringify(c)})'>Edit</button><button class="primary" onclick='openPay("${c.id}")'>Record Payment</button><button class="danger" onclick='removeCard("${c.id}")'>Delete</button></div></article>`}).join(""):`<div class="card empty">No credit cards yet.<br>Tap <b>+ Add Card</b> to get started.</div>`;
let soon=cards.filter(c=>status(c)[0]!=="Upcoming").sort((a,b)=>a.due.localeCompare(b.due));
$("summary").innerHTML=cards.length?`<div class="row"><span class="muted">Payments planned this cycle</span><b>${money(cards.reduce((a,c)=>a+c.planned,0))}</b></div><div class="row"><span class="muted">Cards needing attention</span><b>${soon.length}</b></div><div class="row"><span class="muted">Overall utilization</span><b>${(()=>{let l=cards.reduce((a,c)=>a+c.limit,0),b=cards.reduce((a,c)=>a+c.balance,0);return l?(b/l*100).toFixed(1)+"%":"—"})()}</b></div>`:`<div class="empty">Add your cards to see your summary.</div>`;
$("history").innerHTML=history.length?history.slice().reverse().map(h=>`<article class="card"><div class="row"><b>${esc(h.name)}</b><span class="paid">${money(h.amount)} paid</span></div><div class="muted">${new Date(h.date+"T12:00:00").toLocaleDateString()}</div></article>`).join(""):`<div class="card empty">No payments recorded yet.</div>`}\nfunction openPay(id){paying=id;let c=cards.find(x=>x.id===id);$("payCard").textContent=c.name+" — current balance "+money(c.balance);$("payAmount").value=c.planned||c.minimum;$("payDate").value=today();payDlg.showModal()}
$("payForm").onsubmit=e=>{e.preventDefault();let c=cards.find(x=>x.id===paying),a=+$("payAmount").value;if(!c||a<=0)return;c.balance=Math.max(0,c.balance-a);history.push({name:c.name,amount:a,date:$("payDate").value});c.planned=Math.max(0,c.planned-a);payDlg.close();save()};
function removeCard(id){if(confirm("Delete this card?")){cards=cards.filter(c=>c.id!==id);save()}}
function clearHistory(){if(confirm("Clear payment history?")){history=[];save()}}
function esc(s){return String(s).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]))}
render();
</script>
<script>if('serviceWorker' in navigator){navigator.serviceWorker.register('./service-worker.js').catch(()=>{});}</script></body></html>
